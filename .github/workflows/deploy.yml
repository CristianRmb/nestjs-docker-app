#! QUi IL DEPLOY SU ECS 1

name: CI/CD & Deploy to ECS

on:
  push:
    branches:
      - aws-deploy

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-north-1
      AWS_ACCOUNT_ID: 036338176833 # Sostituisci col tuo reale AWS Account ID (senza trattini)
      ECR_REPOSITORY: nest-app

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v3

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⚡ Generate Prisma Client
        run: npx prisma generate

      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔥 Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🚀 Build Docker image and push to ECR
        run: |
          IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest
          docker build --platform linux/amd64 -t $ECR_REPOSITORY .
          docker tag $ECR_REPOSITORY:latest $IMAGE_URI
          docker push $IMAGE_URI

      - name: 🚀 Force new deployment on ECS
        env:
          ECS_CLUSTER: nest-app-cluster
          ECS_SERVICE: task-nest-app-service-47p3bckk
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION

